<!doctype html>
<!-- 填空表单的外壳。表单本身不写在这里：它由 app.js 照着 schema.py 的字段表
     长出来，所以加一个字段只改 schema.py，这个文件不用动。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一页简历 · 填空</title>
<!-- 内嵌一张竖脊图标，省掉一次 favicon 404；也和简历上那条竖线是同一个记号 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fff'/%3E%3Crect x='4' y='2' width='1.4' height='12' fill='%230E4F4A'/%3E%3Crect x='7.5' y='3' width='6' height='1.2' fill='%2377879A'/%3E%3Crect x='7.5' y='7.4' width='6' height='1.2' fill='%2377879A'/%3E%3Crect x='7.5' y='11.8' width='4' height='1.2' fill='%2377879A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header class="bar">
  <div class="brand">
    <strong>一页简历</strong>
    <span class="brand-sub">填空 → 实时预览 → 出 PDF</span>
  </div>

  <div class="bar-controls">
    <!-- 选一个文件就打开它，不再需要"先填名字再点读取" -->
    <label class="control">
      <span>文件</span>
      <select id="file-picker" title="选一份内容文件打开"></select>
    </label>

    <button id="btn-new" type="button" class="ghost">新建</button>
    <button id="btn-save" type="button" class="ghost" disabled
            title="写回当前文件（Ctrl-S）">保存</button>
    <button id="btn-save-as" type="button" class="ghost" disabled
            title="存成另一个名字">另存为…</button>
    <button id="btn-history" type="button" class="ghost" disabled
            title="看这个文件以前存过的版本">历史版本…</button>

    <label class="control">
      <span>版式</span>
      <select id="theme-name"></select>
    </label>

    <button id="btn-render" type="button" class="primary" disabled>生成 PDF</button>
    <button id="btn-help" type="button" class="icon" title="这个界面怎么用">?</button>
  </div>
</header>

<main class="stage">
  <section class="pane form-pane" aria-label="简历内容表单">
    <nav id="jump" class="jump" aria-label="跳到某一块"></nav>
    <div id="form" class="form"></div>
    <p class="form-foot">
      改动只在浏览器里，点<strong>保存</strong>才写进文件；每次覆盖前都会把上一版
      留在内容目录的 <code>.history/</code> 里。这个页面和 <code>python fill.py</code>
      认的是同一份文件。
    </p>
  </section>

  <section class="pane view-pane" aria-label="预览">
    <div class="status">
      <span id="stat-pages" class="stat">页数 —</span>
      <!-- 点一下列出还差哪些空，再点一条就跳过去 -->
      <button id="stat-blanks" type="button" class="stat" aria-expanded="false">空白 —</button>
      <span id="stat-mode" class="stat muted"></span>
      <span class="stat-gap"></span>
      <span id="stat-file" class="stat muted"></span>
      <span id="stat-badge" class="badge"></span>
    </div>

    <div id="blank-list" class="blank-list" hidden></div>

    <!-- 生成之后列在这里：每个文件一行，查看 / 下载 / 另存到… / 在文件夹中显示 -->
    <div id="results" class="results" hidden></div>

    <!-- 持久横幅的落点：读取 / 保存 / 生成失败时停在这里，直到你关掉它 -->
    <div id="banners" class="banners" role="alert" aria-live="assertive"></div>

    <div id="paper" class="paper">
      <!-- 简历本身没有脚本；sandbox 留空表示什么都不许它做，只当纸看。 -->
      <div class="paper-fit">
        <iframe id="sheet" title="简历预览" sandbox></iframe>
      </div>
    </div>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- 加载顺序有讲究：前面几个文件只声明函数和常量，app.js 负责建 state / el、
     绑事件、启动。顺序错了会在加载期就撞上未定义的名字。 -->
<script src="/static/ui.js"></script>
<script src="/static/form.js"></script>
<script src="/static/preview.js"></script>
<script src="/static/export.js"></script>
<script src="/static/files.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
