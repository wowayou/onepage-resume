# 虚构示例内容。仓库里跟踪的就是这一份，它只用来证明工具能跑通、版面长什么样。
#
# 里面所有人名、公司、域名、数字都是编的：张三是中文占位名，Acme / Globex 是
# 通用虚构公司名，example.com / example.org 是 RFC 2606 保留域名，永远不会指向
# 真实站点。**不要把你的真实信息写进这个文件**——它是要被提交到公开仓库的。
#
# 你自己的那一份这样开始：
#     cp content.example.toml content.toml
# content.toml 和 content.local.toml 都在 .gitignore 里，不会被提交。

[document]
status = "example"
updated = "2026-08-21"
# 生成物的文件名主干：build/resume.pdf、build/resume.html、build/resume.png
output_basename = "resume"
title = "英文 SEO / 独立站运营 / B2B 网站增长 - 简历"
subject = "英文网站增长运营岗位简历"
keywords = ["SEO", "Google SEO", "B2B", "独立站", "英文内容", "GSC", "GA4", "Technical SEO"]
# 页脚。真正要投出去的那一份把下面两行清空，页脚整条消失——
# 带着"示例内容"字样投出去等于告诉对方这是没填完的模板。
preview_note = "示例内容 · 人名 / 公司 / 域名 / 数字均为虚构"
edition = "一页附件版"

[profile]
name = "张三"
intent = "英文 SEO · 独立站运营 · B2B 网站增长"
# 顶部身份行，与联系方式合并成一行，用 · 分隔
facts = ["城市 / 可远程"]

# 联系方式：示例里只保留公开主页类链接（个人博客、GitHub）。
# 手机 / 邮箱 / 微信这类能直接定位到人的信息，只写进你自己的 content.toml
# （已被 .gitignore 挡住），不要写进这份会提交到公开仓库的示例。
[[contacts]]
label = ""
value = "example.com"
href = "https://example.com"

[[contacts]]
label = ""
value = "github.com/example"
href = "https://github.com/example"

# 顶部概况段。位置紧接姓名，不另设标题。
