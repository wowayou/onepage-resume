# 两件事：证明仓库在一台干净机器上真的能装能跑，以及把隐私体检自动化
# （含预览图是否过期——CI 里没有 .identifiers，标识串那一项会自动跳过）。
# 只渲染虚构示例——CI 里永远没有真实内容文件。
name: render

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  render-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 隐私体检
        run: ./scripts/check-privacy.sh

      - name: 装系统依赖（WeasyPrint 的 pango / cairo / 字体）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libfontconfig1 libcairo2 \
            fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-core \
            poppler-utils

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 装 Python 依赖
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 回归测试（Python 与浏览器逻辑）
        run: make test PY=python

      - name: 渲染示例
        run: python render.py --content content.example.toml --out-dir build/example

      - name: 空白表单必须被拦下（填空 → 渲染这条链的守卫）
        run: |
          python fill.py --blank --out /tmp/blank.toml
          if python render.py --content /tmp/blank.toml --out-dir /tmp/blank-out; then
            echo "空白表单竟然渲染成功了：schema 的必填标记和渲染器脱节了"
            exit 1
          fi

      - name: 示例表单必须能渲染（schema 覆盖了渲染器要的全部字段）
        run: python fill.py --blank --sample --out /tmp/sample.toml &&
             python render.py --content /tmp/sample.toml --out-dir /tmp/sample-out

      - name: 确认是一页
        run: |
          pages=$(pdfinfo build/example/resume.pdf | awk '/^Pages:/ {print $2}')
          echo "页数：$pages"
          [ "$pages" = "1" ]

      - uses: actions/upload-artifact@v7
        with:
          name: example-resume
          path: build/example/
